app:
  name: "操作宏录制和回放"
  version: "1.0.0"
  debug: true
  log_path: "./logs"

record:
  max_duration: 3600
  enable_screenshot: false
  filter_mouse_move: true

playback:
  default_speed: 1.0
  enable_sound: true
  stop_on_error: true

storage:
  macros_dir: "./macros"
  backup_enabled: true
  backup_dir: "./backups"
  max_backup_count: 10
